<head>

<title>Page not found | Tenbars</title>

<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">

<style>
:root{
  --paper:#ECEDEF;--surface:#FFFFFF;--sunk:#DDE0E5;--ink:#141518;--ink-2:#5A5E66;--line:#D2D5DA;
  --signal:#2638E8;--signal-ink:#FFFFFF;--signal-soft:rgba(38,56,232,.09);--miss:#D93A3F;
  --display:'Gloock',Georgia,'Times New Roman',serif;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#111214;--surface:#1A1B1F;--sunk:#2A2C31;--ink:#ECEDEF;--ink-2:#9A9EA6;--line:#2C2E33;
    --signal:#7D89FF;--signal-ink:#0C0D12;--signal-soft:rgba(125,137,255,.12);--miss:#FF6B6B}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1;display:flex;align-items:center}
main>.wrap{width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}
.top{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:30px;line-height:1;letter-spacing:-.01em}
.brand svg{width:28px;height:28px;flex:none;margin-top:-2px}
.brand svg path{fill:var(--signal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(1.08)}
footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom));font-size:14px;color:var(--ink-2)}
footer p{margin:0}

/* ---------- Not found ---------- */
.nf{max-width:640px;margin:0 auto;padding:clamp(40px,9vh,104px) 0 clamp(56px,10vh,120px);text-align:center}
.nf-mark{display:inline-flex;align-items:flex-end;gap:18px;margin-bottom:30px}
.nf-bars{display:flex;align-items:flex-end;gap:5px;height:64px}
.nf-bars i{width:10px;height:calc(30% + var(--i) * 7.8%);border-radius:2px;background:var(--sunk)}
.nf-bars i:nth-child(-n+4){background:var(--signal);animation:nf-bar 2.2s ease both;animation-delay:calc(.2s + var(--i) * 60ms)}
.nf-code{display:flex;font-family:var(--display);font-size:84px;line-height:.78;letter-spacing:-.02em}
.nf-code span{animation:nf-digit .45s cubic-bezier(.2,.8,.2,1) both}
.nf-code span:nth-child(1){animation-delay:.3s}
.nf-code span:nth-child(2){animation-delay:1.05s;color:var(--signal)}
.nf-code span:nth-child(3){animation-delay:1.7s}
@keyframes nf-bar{0%{background:var(--sunk)}10%,36%{background:var(--signal)}46%,64%{background:var(--sunk)}74%,100%{background:var(--signal)}}
@keyframes nf-digit{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nf-kicker{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--signal)}
.nf h1{font-family:var(--display);font-size:clamp(34px,5.6vw,56px);line-height:1.03;letter-spacing:-.015em;max-width:15ch;margin:0 auto}
.nf-text{margin:16px auto 0;font-size:17px;line-height:1.55;color:var(--ink-2);max-width:44ch}
.nf-typed{display:inline-flex;align-items:center;gap:10px;max-width:100%;margin:24px 0 0;padding:8px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.nf-typed span{flex:none;color:var(--ink-2)}
.nf-typed code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;color:var(--ink);text-decoration:underline wavy var(--miss);text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-skip-ink:none;padding-bottom:4px}
.nf-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:30px}
.nf-actions .btn{height:46px;padding:0 20px;font-size:15px}
.nf-actions svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nf-search{max-width:440px;margin:40px auto 0;padding-top:28px;border-top:1px solid var(--line)}
.nf-search label{display:block;margin-bottom:10px;font-size:14px;color:var(--ink-2)}
.nf-search div{display:flex;gap:8px}
.nf-search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 14px;font-size:15px;outline:none}
.nf-search input:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.nf-search .btn{height:44px}
@media (max-width:520px){
  .nf-mark{gap:14px;margin-bottom:24px}
  .nf-bars{height:52px;gap:4px}
  .nf-bars i{width:8px}
  .nf-code{font-size:66px}
  .nf-text{font-size:16px}
  .nf-actions .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.nf-bars i,.nf-code span{animation:none!important}}

</style>
<script>window.va = window.va || function () { (window.va.q = window.va.q || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap"><a href="/" class="brand" aria-label="Tenbars home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.00 1.00 L19.52 5.16 L24.82 3.86 L25.22 9.30 L30.27 11.36 L27.40 16.00 L30.27 20.64 L25.22 22.70 L24.82 28.14 L19.52 26.84 L16.00 31.00 L12.48 26.84 L7.18 28.14 L6.78 22.70 L1.73 20.64 L4.60 16.00 L1.73 11.36 L6.78 9.30 L7.18 3.86 L12.48 5.16Z"/></svg>Tenbars</a></div>
</header>
<main>
  <div class="wrap">
    <section class="nf" aria-labelledby="nf-h">
      <div class="nf-mark" aria-hidden="true">
        <div class="nf-bars"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i></div>
        <div class="nf-code"><span>4</span><span>0</span><span>4</span></div>
      </div>
      <p class="nf-kicker">Error 404 · Page not found</p>
      <h1 id="nf-h">You sure about what you typed?</h1>
      <p class="nf-text">We checked every bar and this page isn’t here. There might be a typo in the address, or the link is out of date.</p>
      <p class="nf-typed" id="nf-typed" hidden><span>You typed</span><code id="nf-path"></code></p>
      <div class="nf-actions">
        <a class="btn primary" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg>Take me home</a>
        <a class="btn" href="/#/mine">Your ratings</a>
      </div>
      <form class="nf-search" id="nf-search" role="search" autocomplete="off">
        <label for="nf-q">Looking for a series? Search for it instead.</label>
        <div><input id="nf-q" type="search" placeholder="Search for a series" enterkeyhint="search"><button class="btn" type="submit">Search</button></div>
      </form>
    </section>
  </div>
</main>
<footer><div class="wrap"><p>Tenbars. Score every episode you watch, out of 10.</p></div></footer>
<script>
(function () {
  var path = location.pathname + location.search;
  if (path && path !== '/') {
    var shown = path; try { shown = decodeURI(path); } catch (err) {}
    document.getElementById('nf-path').textContent = location.host + shown;
    document.getElementById('nf-typed').hidden = false;
  }
  document.getElementById('nf-search').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('nf-q').value.trim();
    location.href = q ? '/#/search/' + encodeURIComponent(q) : '/';
  });
})();
</script>
</body>
</html>
